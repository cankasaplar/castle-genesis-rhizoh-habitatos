<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="220" viewBox="0 0 920 220" role="img" aria-label="Rhizoh authority state machine">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
    <style>
      .box { fill:#f8fafc; stroke:#0f172a; stroke-width:1.5; rx:8; }
      .label { font: 600 13px Arial, sans-serif; fill:#0f172a; }
      .sub { font: 11px Arial, sans-serif; fill:#475569; }
      .edge { stroke:#334155; stroke-width:1.5; fill:none; marker-end:url(#arrow); }
      .title { font: 700 15px Arial, sans-serif; fill:#0f172a; }
    </style>
  </defs>
  <text x="20" y="24" class="title">Authority pipeline (formal transition model)</text>
  <rect x="20" y="70" width="120" height="56" class="box"/>
  <text x="80" y="96" text-anchor="middle" class="label">PREVIEW</text>
  <text x="80" y="114" text-anchor="middle" class="sub">TRUTH_LOG_PREVIEW</text>
  <rect x="170" y="70" width="120" height="56" class="box"/>
  <text x="230" y="96" text-anchor="middle" class="label">PROPOSE</text>
  <text x="230" y="114" text-anchor="middle" class="sub">client_shadow</text>
  <rect x="320" y="70" width="120" height="56" class="box"/>
  <text x="380" y="96" text-anchor="middle" class="label">VALIDATE</text>
  <text x="380" y="114" text-anchor="middle" class="sub">gateway</text>
  <rect x="470" y="70" width="120" height="56" class="box"/>
  <text x="530" y="96" text-anchor="middle" class="label">COMMIT</text>
  <text x="530" y="114" text-anchor="middle" class="sub">TRUTH_LOG_APPEND</text>
  <rect x="620" y="70" width="130" height="56" class="box"/>
  <text x="685" y="96" text-anchor="middle" class="label">RECONCILE</text>
  <text x="685" y="114" text-anchor="middle" class="sub">drift merge</text>
  <rect x="780" y="70" width="120" height="56" class="box"/>
  <text x="840" y="96" text-anchor="middle" class="label">REDUCE</text>
  <text x="840" y="114" text-anchor="middle" class="sub">projection</text>
  <line x1="140" y1="98" x2="168" y2="98" class="edge"/>
  <line x1="290" y1="98" x2="318" y2="98" class="edge"/>
  <line x1="440" y1="98" x2="468" y2="98" class="edge"/>
  <line x1="590" y1="98" x2="618" y2="98" class="edge"/>
  <line x1="750" y1="98" x2="778" y2="98" class="edge"/>
  <text x="20" y="170" class="sub">Reject path: VALIDATE to MATCH_EVENT_REJECTED (no COMMIT)</text>
  <text x="20" y="190" class="sub">Single-writer: only gateway_ack enters COMMIT; client commitAuthority is null</text>
</svg>
