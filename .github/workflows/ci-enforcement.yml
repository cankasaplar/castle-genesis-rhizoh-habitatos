name: CI Enforcement (SAFE MODE)

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  client-enforcement:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: bash scripts/npm-ci-retry.sh

      - name: Typecheck
        run: npm run typecheck -w apps/client

      - name: Tests
        run: npm run test -w apps/client
