name: CI Enforcement (SAFE MODE)

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  client-enforcement:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: bash scripts/npm-ci-retry.sh

      - name: Frozen core + SPECFLOW gates
        run: |
          npm run stabilization:validate-graph
          npm run stabilization:validate-specflow

      - name: Typecheck
        run: npm run typecheck -w apps/client

      - name: Chess learning + substrate tests
        run: |
          npm run test:chess-learning -w apps/client
          npm run test:predeploy-substrate -w apps/client
          npm run test:substrate-authority -w apps/client
